    post:
      operationId: inspect_mcp_tool
      summary: Unified MCP tool inspection
      description: "Unified endpoint for inspecting MCP tools. Supports three modes: (1) tool_id \u2014 inspect an existing\
        \ local or remote MCP tool by database ID, (2) servers \u2014 inspect one or more remote MCP server configs (pre-add),\
        \ (3) file_name + file_data_base64 \u2014 inspect an uploaded package (pre-add). Returns a list of per-server inspection\
        \ results.\n"
      tags:
      - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_id:
                  type: string
                  description: ID of an existing MCP tool to inspect
                  nullable: true
                servers:
                  type: object
                  description: Map of server_name to server config for pre-add remote inspection
                  additionalProperties:
                    type: object
                  nullable: true
                file_name:
                  type: string
                  description: Filename for pre-add upload inspection
                  nullable: true
                file_data_base64:
                  type: string
                  description: Base64-encoded file content for pre-add upload inspection
                  nullable: true
                model:
                  type: string
                  description: LLM model for security inspection
                  nullable: true
      responses:
        '200':
          description: Unified inspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  servers:
                    type: array
                    description: Per-server inspection results
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        server_name:
                          type: string
                        server_type:
                          type: string
                        tools:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              description:
                                type: string
                              parameters:
                                type: object
                        tool_count:
                          type: integer
                        security:
                          type: object
                          nullable: true
                        error:
                          type: string
                          nullable: true
                        detection_method:
                          type: string
                  error:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Unexpected'
