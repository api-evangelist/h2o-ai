          type: boolean
          default: false
        gen_doc_questions:
          description: Whether to auto-generate sample questions for each document (uses LLM)
          type: boolean
          default: false
        audio_input_language:
          description: Language of audio files. Defaults to "auto" language detection. Pass empty string to see choices.
          type: string
          default: auto
        ocr_model:
          description: Which method to use to extract text from images using AI-enabled optical character recognition (OCR)
            models. Pass empty string to see choices. docTR is best for Latin text, PaddleOCR is best for certain non-Latin
            languages, Tesseract covers a wide range of languages. Mississippi works well on handwriting. auto - Automatic
            will auto-select the best OCR model for every page. off - Disable OCR for speed, but all images will then be skipped
            (also no image captions will be made).
          type: string
          default: auto
        tesseract_lang:
          description: Which language to use when using ocr_model="tesseract". Pass empty string to see choices.
          type: string
        keep_tables_as_one_chunk:
          description: When tables are identified by the table parser the table tokens will be kept in a single chunk.
          type: boolean
        chunk_by_page:
          description: Each page will be a chunk. `keep_tables_as_one_chunk` will be ignored if this is `true`.
          type: boolean
        handwriting_check:
          description: Check pages for handwriting. Will use specialized models if handwriting is found.
          type: boolean
