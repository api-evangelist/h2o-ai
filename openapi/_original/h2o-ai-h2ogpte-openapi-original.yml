        schema:
          type: string
          enum:
          - name
          - username
          - type
          - size
          - page_count
          - connector
          - uri
          - original_type
          - original_mtime
          - status
          - updated_at
          default: updated_at
      - name: ascending
        in: query
        description: When true, returns sorted by sort_column in ascending order.
        required: false
        schema:
          type: boolean
          default: false
