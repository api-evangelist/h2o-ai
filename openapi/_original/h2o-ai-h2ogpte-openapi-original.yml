  /scheduled_tasks/generate_spec:
    post:
      operationId: generate_scheduled_task_spec
      summary: Generate a scheduled task spec from a prompt.
      description: 'Uses an LLM with guided JSON to generate a scheduled task configuration

        from a natural language description. The returned spec can be used directly

        with the create_scheduled_task RPC.

        '
      tags:
      - System
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              properties:
                prompt:
                  type: string
                  description: Natural language description of the desired scheduled task.
                llm:
                  type: string
                  description: Optional LLM model override for generation.
                timezone:
                  type: string
                  description: 'Optional IANA timezone string (e.g. "America/New_York") used to compute

                    today''s local date for relative schedule expressions. Defaults to UTC.

                    '
                use_agent:
                  type: boolean
                  description: 'When true, signals to the LLM that the user has agent mode enabled in

                    their chat so it should prefer task_type=agent_task unless the prompt

                    clearly describes a plain chat-completion task. Does not force the

                    generated task_type.

                    '
        required: true
      responses:
        '200':
          description: Generated scheduled task configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    type: object
                    description: The generated scheduled task spec.
                  passed:
                    type: boolean
                    description: 'Whether the user prompt was minimally sufficient to create the task.

                      Callers MUST NOT create the task when passed is false; only show

                      `response` to the user.

                      '
                  response:
                    type: string
                    description: 'When passed=false, a clarifying question describing what info is missing.

                      When passed=true, a human-language confirmation of what was scheduled,

                      including any defaults the LLM inferred.

                      '
                  llm_used:
                    type: string
                    description: The actual model that generated the spec.
            text/event-stream:
              schema:
                type: string
                description: "Server-Sent Events stream when `Accept: text/event-stream` is requested.\nThree event types\
                  \ are emitted:\n- `progress` \u2014 `{\"chars\": <number>}` incremental character count from the LLM stream.\n\
                  - `done` \u2014 same JSON payload as the `application/json` 200 response.\n- `error` \u2014 `{\"message\"\
                  : \"<string>\"}` on generation failure.\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /ai_assistants/generate_spec:
    post:
      operationId: generate_assistant_spec
      summary: Generate AI assistant spec from a prompt.
      description: 'Uses an LLM with guided JSON to generate one or more AI assistant configurations

        from a natural language description. The returned specs map to every field in the

        create-assistant UI and can be used directly with the create_ai_assistant endpoint.

        '
      tags:
      - AI Assistants
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              properties:
                prompt:
                  type: string
                  description: Natural language description of the desired assistant(s).
                llm:
                  type: string
                  description: Optional LLM model override for generation.
                count:
                  type: integer
                  description: Number of assistant configurations to generate (default 1).
        required: true
      responses:
        '200':
          description: Generated assistant configurations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assistants:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiAssistantSpec'
                  passed:
                    type: boolean
                    description: 'Whether the user prompt was minimally sufficient to create the assistant.

                      Callers MUST NOT create any assistants when passed is false; only show

                      `response` to the user.

                      '
                  response:
                    type: string
                    description: 'When passed=false, a clarifying question describing what info is missing.

                      When passed=true, a human-language confirmation of what was created,

                      including any defaults the LLM inferred.

                      '
                  llm_used:
                    type: string
                    description: The actual model that generated the specs (populated when llm=auto).
            text/event-stream:
              schema:
                type: string
                description: "Server-Sent Events stream when `Accept: text/event-stream` is requested.\nThree event types\
                  \ are emitted:\n- `progress` \u2014 `{\"chars\": <number>}` incremental character count from the LLM stream.\n\
                  - `done` \u2014 same JSON payload as the `application/json` 200 response.\n- `error` \u2014 `{\"message\"\
                  : \"<string>\"}` on generation failure.\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
