      summary: List live sessions
      description: "Allows admins to enumerate live sessions stored in Redis. Returns metadata only \u2014 never access tokens,\
        \ refresh tokens, or CSRF values. Pagination is cursor-based; pass back the `next_cursor` from a previous response\
        \ to continue, or omit to start fresh. Iteration is complete when `next_cursor` is absent."
      tags:
      - Admin Sessions
      parameters:
      - name: cursor
        in: query
        description: Opaque cursor returned by a previous call. Omit on the first call.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of sessions to return in this page. Defaults to 100, hard-capped at 500.
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an admin.
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Unexpected'
