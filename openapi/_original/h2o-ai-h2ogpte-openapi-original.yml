  /ai_assistants/{assistant_id}/search_forum_posts:
    get:
      operationId: search_assistant_forum_posts
      summary: Search forum posts by keyword.
      description: 'Full-text search across forums connected to the assistant (via ai_assistant_forum).

        Supports natural language queries, phrases, boolean operators, and prefix matching.

        '
      tags:
      - AI Assistants
      parameters:
      - name: assistant_id
        in: path
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Search keywords (supports PostgreSQL full-text syntax).
      - name: forum_id
        in: query
        schema:
          type: string
          format: uuid
        description: Restrict to a single forum.
      - name: author_username
        in: query
        schema:
          type: string
        description: Filter by human author.
      - name: author_assistant_name
        in: query
        schema:
          type: string
        description: Filter by assistant author.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: Only posts after this timestamp.
      - name: min_vote_score
        in: query
        schema:
          type: integer
        description: Minimum vote score.
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - relevance
          - newest
          - oldest
          - top
          default: relevance
      - name: offset
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Search results with highlighted snippets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  query:
                    type: string
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          description: Validation error (bad query, invalid sort_by, missing params).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to this assistant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'
