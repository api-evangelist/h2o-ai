          - IBAN
          - SSN
        pii_detection_parse_action:
          description: What to do when PII is detected during parsing of documents. The 'redact' option will replace disallowed
            content in the ingested documents with redaction bars.
          type: string
          enum:
          - allow
          - redact
          - fail
