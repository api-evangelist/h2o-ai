          enum:
          - standard
          - lite
          - agent_only
        follow_links:
          description: Whether to import all web pages linked from this URL will be imported. External links will be ignored.
            Links to other pages on the same domain will be followed as long as they are at the same level or below the URL
            you specify. Each page will be transformed into a PDF document.
          type: boolean
        max_depth:
          description: Max depth of recursion when following links, only when follow_links is `true`. Max_depth of 0 means
            don't follow any links, max_depth of 1 means follow only top-level links, etc. Use -1 for automatic (system settings).
          type: integer
        max_documents:
          description: Max number of documents when following links, only when follow_links is `true`. Use None for automatic
            (system defaults). Use -1 for max (system limit).
          type: integer
        root_dir:
          description: Root directory for document storage
          type: string
        copy_document:
