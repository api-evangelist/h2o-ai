    TagFilter:
      type: object
      description: "Filter for document tags supporting inclusion and exclusion.\n\nNote: The exclude list takes priority\
        \ over the include list. If a document has a tag\nthat appears in both lists, the document will be excluded.\n\nExamples:\n\
        \  - Include only documents with 'red' OR 'blue' tags: {\"include\": [\"red\", \"blue\"]}\n  - Exclude documents with\
        \ 'red' OR 'blue' tags: {\"exclude\": [\"red\", \"blue\"]}\n  - Include documents with 'color' tag BUT exclude 'red'\
        \ and 'blue': {\"include\": [\"color\"], \"exclude\": [\"red\", \"blue\"]}\n"
      properties:
        include:
          type: array
          items:
            type: string
          description: Include documents with ANY of these tags (OR operation).
        exclude:
          type: array
          items:
            type: string
          description: Exclude documents with ANY of these tags (OR operation). Takes priority over include.
