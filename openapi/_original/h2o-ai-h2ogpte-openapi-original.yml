    ScheduledTaskCreateRequest:
      type: object
      required:
      - name
      - schedule_type
      - schedule_expression
      - task_type
      - task_config
      properties:
        name:
          type: string
        description:
          type: string
        schedule_type:
          type: string
          enum:
          - once
          - recurring
          - interval
        schedule_expression:
          type: string
          description: ISO-8601 datetime for once, 5-field cron for recurring, "N minutes"/"N hours" for interval.
        task_type:
          type: string
          enum:
          - chat_completion
          - agent_task
        task_config:
          type: object
          additionalProperties: true
          description: Must contain a non-empty "message" key (the question/prompt). May include "timezone", "collection_id",
            "llm_args".
        max_executions:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        notification_email:
          type: string
    ScheduledTaskUpdateRequest:
      type: object
      description: 'Partial update. Omit a field to leave it unchanged. To CLEAR a nullable field, use the sentinel: max_executions
        = -1 clears it; expires_at = 1970-01-01T00:00:00Z clears it. To pause/resume, set status to "paused"/"active".

        '
      properties:
        name:
          type: string
        description:
          type: string
        schedule_type:
          type: string
          enum:
          - once
          - recurring
          - interval
        schedule_expression:
          type: string
        task_type:
          type: string
          enum:
          - chat_completion
          - agent_task
        task_config:
          type: object
          additionalProperties: true
        task_config_patch:
          type: object
          additionalProperties: true
          description: 'Partial task_config update. Top-level keys are merged into the stored task_config; a key whose value
            is JSON null is REMOVED (e.g. {"collection_id": null} unbinds the collection). Nested objects are replaced whole,
            not deep-merged. Mutually exclusive with task_config. The merged result must keep a non-empty ''message''.

            '
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          - expired
        max_executions:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        notification_email:
          type: string
    ScheduledTaskAdminUpdateRequest:
      type: object
      description: "Admin partial update \u2014 status and metadata only. max_executions and expires_at are intentionally\
        \ NOT settable here (the admin SQL does not honor the clear-sentinels), matching the UI's admin update which only\
        \ changes status.\n"
      properties:
        name:
          type: string
        description:
          type: string
        schedule_type:
          type: string
          enum:
