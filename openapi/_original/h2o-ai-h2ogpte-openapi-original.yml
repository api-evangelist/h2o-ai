components:
  parameters:
    IngestionParameterUploadIds:
      name: upload_ids
      in: path
      description: Id of uploaded document
      required: true
      schema:
        type: array
        items:
          type: string
    IngestionParameterCollectionId:
      name: collection_id
      in: query
      description: String id of the collection to add the ingested documents into.
      required: true
      schema:
        type: string
    IngestionParameterDocumentId:
      name: document_id
      in: query
      description: String id of the document to be parsed.
      required: true
      schema:
        type: string
    IngestionParameterFileName:
      name: file_name
      in: query
      description: String of the file name to use for the document.
      required: true
      schema:
        type: string
    IngestionParameterGenDocSummaries:
      name: gen_doc_summaries
      in: query
      description: Whether to auto-generate document summaries (uses LLM).
      schema:
        type: boolean
        default: false
    IngestionParameterGenDocQuestions:
      name: gen_doc_questions
      in: query
      description: Whether to auto-generate sample questions for each document (uses LLM).
      schema:
        type: boolean
        default: false
    IngestionParameterFollowLinks:
      name: follow_links
      in: query
      description: Whether to import all web pages linked from this URL will be imported. External links will be ignored.
        Links to other pages on the same domain will be followed as long as they are at the same level or below the URL you
        specify. Each page will be transformed into a PDF document.
      schema:
        type: boolean
        default: false
    IngestionParameterMaxDepth:
      name: max_depth
      in: query
      description: Max depth of recursion when following links, only when follow_links is `true`. Max_depth of 0 means don't
        follow any links, max_depth of 1 means follow only top-level links, etc. Use -1 for automatic (system settings).
      schema:
        type: integer
        default: -1
    IngestionParameterMaxDocuments:
      name: max_documents
      in: query
      description: Max number of documents when following links, only when follow_links is `true`. Use None for automatic
        (system defaults). Use -1 for max (system limit).
      schema:
        type: integer
    IngestionParameterAudioInputLanguage:
      name: audio_input_language
      in: query
      description: Language of audio files.
      schema:
        type: string
        default: auto
    IngestionParameterOcrModel:
      name: ocr_model
      in: query
      description: Which method to use to extract text from images using AI-enabled optical character recognition (OCR) models.
        docTR is best for Latin text, PaddleOCR is best for certain non-Latin languages, Tesseract covers a wide range of
        languages. Mississippi works well on handwriting. - `auto` - Automatic will auto-select the best OCR model for every
        page. - `off` - Disable OCR for speed, but all images will then be skipped (also no image captions will be made).
      schema:
        type: string
        default: auto
    IngestionParameterTesseractLang:
      name: tesseract_lang
      in: query
      description: Which language to use when using ocr_model="tesseract".
      schema:
        type: string
    IngestionParameterKeepTablesAsOneChunk:
      name: keep_tables_as_one_chunk
      in: query
      description: When tables are identified by the table parser the table tokens will be kept in a single chunk.
      schema:
        type: boolean
    IngestionParameterChunkByPage:
      name: chunk_by_page
      in: query
      description: Each page will be a chunk. `keep_tables_as_one_chunk` will be ignored if this is `true`.
      schema:
        type: boolean
    IngestionParameterHandwritingCheck:
      name: handwriting_check
      in: query
      description: Check pages for handwriting. Will use specialized models if handwriting is found.
      schema:
        type: boolean
    IngestionParameterIngestMode:
      name: ingest_mode
      in: query
      description: Ingest mode to use. - `standard` - Files will be ingested for use with RAG - `agent_only` - Bypasses standard
        ingestion. Files can only be used with agents.
      schema:
        type: string
        enum:
        - standard
        - agent_only
    IngestionParameterRestricted:
      name: restricted
      in: query
      description: Whether the document should be restricted only to certain users.
      schema:
        type: boolean
        default: false
    IngestionParameterPermissions:
      name: permissions
      in: query
      description: The list of usernames having permissions to the document.
      schema:
        type: array
        items:
          type: string
    IngestionParameterEncryptDocument:
      name: encrypt_document
      in: query
      description: Whether to encrypt the document files at rest in object storage.
      schema:
        type: boolean
        default: false
    Timeout:
      name: timeout
      in: query
      description: Timeout in seconds
      schema:
        type: number
        format: double
    ExtractorId:
      name: extractor_id
      in: path
      description: ID of the extractor to run
      required: true
      schema:
        type: string
    ExtractorCollectionId:
      name: collection_id
      in: query
      description: ID of the collection to run the extractor on. Exactly one of collection_id or document_id must be provided.
      required: false
      schema:
        type: string
    ExtractorDocumentId:
      name: document_id
      in: query
      description: ID of the single document to run the extractor on. Exactly one of collection_id or document_id must be
        provided.
      required: false
      schema:
        type: string
    IngestionParameterMetadata:
      name: metadata
      in: query
      description: String with json-encoded metadata for the document.
      schema:
        type: string
    CopyDocument:
      name: copy_document
      in: query
      description: Whether to save a new copy of the document
      schema:
        type: boolean
    PreserveDocumentStatus:
      name: preserve_document_status
      in: query
      description: Whether to preserve each document's original ingest mode (agent_only vs standard) when importing. When
        true, documents with agent_only status remain agent_only in the target collection. When false (default), all documents
        use the ingest_mode parameter uniformly.
      schema:
        type: boolean
    PreserveMetadata:
      name: preserve_metadata
      in: query
      description: Whether to preserve document metadata when copying documents.
      schema:
        type: boolean
        default: false
    MigrateScheduledConnectors:
      name: migrate_scheduled_connectors
      in: query
      description: 'Whether to move scheduled connectors from the source collection to the target collection

        after documents are imported. The source collection will have no scheduled connectors

        after this operation. Only the owner of both collections can use this flag.

        '
      schema:
        type: boolean
        default: false
    CopyLifecycleSettings:
      name: copy_lifecycle_settings
      in: query
      description: 'Whether to copy lifecycle settings (expiry_date, inactivity_interval, size_limit)

        from the source collection to the target collection.

        '
      schema:
        type: boolean
        default: false
    SkipReparse:
      name: skip_reparse
      in: query
      description: 'Whether to skip re-parsing documents and only re-embed existing chunks with the

        target collection''s embedding model. Much faster than full import since it skips

        file fetch, PDF conversion, OCR, and chunking. Only re-embeds the text chunks.

        Cannot be combined with copy_document=true.

        '
      schema:
        type: boolean
        default: false
    SessionId:
      name: Session-Id
      in: header
      description: Optional session identifier for request tracing and correlation
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    RequestEntityTooLarge:
      description: Request entity is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Using an API key generated by H2OGPTe
  schemas:
    ExtractorCreateRequest:
      type: object
      required:
      - name
      - description
      - llm
      - schema
      properties:
        name:
          type: string
          description: Human-readable name
        description:
          type: string
          description: What this extractor does
        llm:
          type: string
          description: Identifier or version of the language model the extractor uses
        schema:
          type: string
          description: JSONSchema (or other spec) that the extractor outputs. When schema is valid and not empty, the output
            will be always returned as JSON object.
        prompt:
          type: string
          description: Custom prompt text for the extractor. If empty, default prompt will be used. If combined with schema,
            prompt can customize the output, but cannot change its format as it will always be JSON object.
        pre_prompt_summary:
          type: string
          description: (Optional) Pre-prompt summary text for the extractor
        keep_intermediate_results:
          type: boolean
          description: (Optional) Flag indicating whether to keep intermediate results during extraction
        system_prompt:
          type: string
          description: (Optional) System prompt text for the extractor
        max_num_chunks:
          type: integer
          description: (Optional) Maximum number of chunks to process
        vision:
          type: string
          description: (Optional) Vision mode setting
        vision_llm:
          type: string
          description: (Optional) Vision LLM model identifier
        image_batch_image_prompt:
          type: string
          description: (Optional) Image batch processing prompt
        image_batch_final_prompt:
          type: string
          description: (Optional) Final prompt for image batch processing
        guardrails_settings:
          $ref: '#/components/schemas/GuardrailsSettings'
    Extractor:
      type: object
      required:
      - name
      - description
      - id
      - created_at
      - is_public
      properties:
        name:
          type: string
          description: Human-readable name
        description:
          type: string
          description: What this extractor does
        llm:
          type: string
          description: (Optional) Identifier or version of the language model the extractor uses
        schema:
          type: string
          description: (Optional) JSONSchema (or other spec) that the extractor outputs
        prompt:
          type: string
          description: (Optional) Prompt text for the extractor
        pre_prompt_summary:
          type: string
          description: (Optional) Pre-prompt summary text for the extractor
        keep_intermediate_results:
          type: boolean
          description: (Optional) Flag indicating whether to keep intermediate results during extraction
        system_prompt:
          type: string
          description: (Optional) System prompt text for the extractor
        max_num_chunks:
          type: integer
          description: (Optional) Maximum number of chunks to process
        vision:
          type: string
          description: (Optional) Vision mode setting
        vision_llm:
          type: string
          description: (Optional) Vision LLM model identifier
        image_batch_image_prompt:
          type: string
          description: (Optional) Image batch processing prompt
        image_batch_final_prompt:
          type: string
          description: (Optional) Final prompt for image batch processing
        guardrails_settings:
          $ref: '#/components/schemas/GuardrailsSettings'
        id:
          type: string
          description: Unique identifier of the extractor
        is_public:
          type: boolean
          description: Flag indicating if the extractor is public
        created_at:
          type: string
          format: date-time
          description: When the extractor definition was created
    DocumentExtractionResult:
      type: object
      required:
      - id
      - document_name
      - content
      - error
      properties:
        id:
          type: string
          description: ID of the document extraction result
        document_id:
          type: string
          nullable: true
          description: ID of the document that was processed. Null when the extraction was run on uploaded files without a
            collection.
        document_name:
          type: string
          description: Name of the document that was processed
        content:
          description: The extracted content as JSON object
          type: object
        error:
          type: string
          description: Contains error in case extraction failed for this document. Otherwise empty.
    APIKeyResult:
      required:
      - secret_key
      - api_key
      type: object
      properties:
        secret_key:
          description: The secret key associated with the newly generated API Key.
          type: string
        api_key:
