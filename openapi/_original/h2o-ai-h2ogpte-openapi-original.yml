            \ Answer the query without any supporting document contexts.\n  Requires 1 LLM call.\n  * `rag` RAG (Retrieval\
            \ Augmented Generation) - Use supporting document contexts\n  to answer the query. Requires 1 LLM call.\n  * `hyde1`\
            \ LLM Only + RAG composite - HyDE RAG (Hypothetical Document Embedding).\n  Use 'LLM Only' response to find relevant\
            \ contexts from a collection for generating\n  a response. Requires 2 LLM calls.\n  * `hyde2` HyDE + RAG composite\
            \ - Use the 'HyDE RAG' response to find relevant\n  contexts from a collection for generating a response. Requires\
            \ 3 LLM calls.\n  * `rag+` Summary RAG - Like RAG, but uses more context and recursive\n  summarization to overcome\
            \ LLM context limits. Keeps all retrieved chunks, puts\n  them in order, adds neighboring chunks, then uses the\
            \ summary API to get the\n  answer. Can require several LLM calls.\n  * `all_data` All Data RAG - Like Summary\
            \ RAG, but includes all document\n  chunks. Uses recursive summarization to overcome LLM context limits.\n  Can\
            \ require several LLM calls.\n"
