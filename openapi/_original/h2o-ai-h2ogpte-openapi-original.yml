          description: What to do when PII is detected in the input to the LLM (document content and user prompts). The 'redact'
            option will replace disallowed content with placeholders.
          type: string
          enum:
          - allow
          - redact
          - fail
        pii_detection_llm_output_action:
          description: What to do when PII is detected in the output of the LLM. The 'redact' option will replace disallowed
            content with placeholders.
