            for each new chat request. Disable if require deterministic answers for a given question.
        tags:
          oneOf:
          - type: array
            items:
              type: string
          - $ref: '#/components/schemas/TagFilter'
          description: "Filter documents by tags for RAG context. Supports two formats:\n  - Array format (backward compatible):\
            \ [\"red\", \"blue\"] includes documents with 'red' OR 'blue' tags\n  - Object format (with exclusions): {\"include\"\
            : [\"color\"], \"exclude\": [\"red\", \"blue\"]}\n"
