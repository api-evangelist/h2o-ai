      - $ref: '#/components/parameters/IngestionParameterHandwritingCheck'
      - $ref: '#/components/parameters/IngestionParameterIngestMode'
      - $ref: '#/components/parameters/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_collection_id
              properties:
                source_collection_id:
                  description: Id of the collection to be inserted.
                  type: string
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /collections/{collection_id}/scheduled_connectors:
    get:
      operationId: list_scheduled_connectors_for_collection
      summary: List scheduled connectors for a collection
      description: Returns a list of all scheduled connectors configured for the specified collection.
      tags:
      - Collections
      parameters:
      - name: collection_id
        in: path
        required: true
        description: Collection ID to list scheduled connectors for
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledConnectorDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  /collections/{collection_id}/migrate_scheduled_connectors:
    post:
      operationId: migrate_scheduled_connectors_to_collection
      summary: Migrate scheduled connectors from another collection
      description: Moves all scheduled connectors from a source collection to the target collection. The source collection will have no scheduled connectors after this operation. Both collections must be owned by the same user.
      tags:
      - Collections
      parameters:
      - name: collection_id
        in: path
        required: true
        description: Target collection ID where scheduled connectors will be copied to
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - src_collection_id
              properties:
                src_collection_id:
                  type: string
                  description: Source collection ID to copy scheduled connectors from
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Unexpected'
  /collections/{collection_id}/migrate_chat_sessions_job:
    post:
      operationId: create_migrate_collection_chat_sessions_job
      summary: Creates a job to migrate all chat sessions from one collection to another.
      description: Creates a job to migrate all chat sessions from the source collection (specified in path) to the destination collection (specified in request body). Only the collection owner can perform this operation.
      tags:
      - Collections
      parameters:
      - name: collection_id
        in: path
        description: Id of the source collection (where chat sessions will be migrated from).
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Timeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateCollectionChatSessionsJobRequest'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  schemas:
    ScheduledConnectorDetails:
      required:
      - id
      - user_id
      - collection_id
      - type
      - schedule
      - created_at
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the connector
        user_id:
          type: string
          description: ID of the user who owns the connector
        user_name:
          type: string
          description: Name of the user who owns the connector
        user_email:
          type: string
          description: Email of the user who owns the connector
        collection_id:
          type: string
          description: ID of the collection this connector is associated with
        collection_name:
          type: string
          description: Name of the collection this connector is associated with
        type:
          type: string
          description: Type of connector (e.g., s3, confluence)
        config:
          type: object
          description: Configuration details for the connector
        schedule:
          type: integer
          description: Schedule interval in seconds (0 means no schedule)
        last_sync_status:
          type: string
          description: Status of the last sync
        last_sync_job_id:
          type: string
          description: ID of the last sync job
        last_sync_at:
          type: string
          format: date-time
          description: Timestamp of the last sync
        last_sync_error:
          type: string
          description: Error message from the last sync (if any)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the connector was created
    GroupSharePermission:
      required:
      - group_id
      type: object
      properties:
        group_id:
          type: string
        permissions:
          type: array
          items:
            type: string
    CollectionUpdateRequest:
      type: object
      properties:
        name:
          description: Name of the collection
          type: string
        description:
          description: Description of the collection
          type: string
        rag_type:
          description: "RAG type options:\n  * `auto` - Automatically select the best rag_type.\n  * `llm_only` LLM Only - Answer the query without any supporting document contexts.\n  Requires 1 LLM call.\n  * `rag` RAG (Retrieval Augmented Generation) - Use supporting document contexts\n  to answer the query. Requires 1 LLM call.\n  * `hyde1` LLM Only + RAG composite - HyDE RAG (Hypothetical Document Embedding).\n  Use 'LLM Only' response to find relevant contexts from a collection for generating\n  a response. Requires 2 LLM calls.\n  * `hyde2` HyDE + RAG composite - Use the 'HyDE RAG' response to find relevant\n  contexts from a collection for generating a response. Requires 3 LLM calls.\n  * `rag+` Summary RAG - Like RAG, but uses more context and recursive\n  summarization to overcome LLM context limits. Keeps all retrieved chunks, puts\n  them in order, adds neighboring chunks, then uses the summary API to get the\n  answer. Can require several LLM calls.\n  * `all_data` All Data RAG - Like Summary RAG, but includes all document\n  chunks. Uses recursive summarization to overcome LLM context limits.\n  Can require several LLM calls.\n"
          type: string
          enum:
          - auto
          - llm_only
          - rag
          - hyde1
          - hyde2
          - rag+
          - all_data
    JobDetailsStatus:
      required:
      - id
      - status
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    ChatCompletionRAGConfig:
      type: object
      description: "A map with arguments to control RAG (retrieval-augmented-generation) types.:\n  * `rag_type` **(type=enum[auto, llm_only, rag, hyde1, hyde2, rag+, all_data])** RAG type options:\n    * `auto` - Automatically select the best rag_type.\n    * `llm_only` LLM Only - Answer the query without any supporting document contexts.\n       Requires 1 LLM call.\n    * `rag` RAG (Retrieval Augmented Generation) - Use supporting document contexts\n       to answer the query. Requires 1 LLM call.\n    * `hyde1` LLM Only + RAG composite - HyDE RAG (Hypothetical Document Embedding).\n       Use 'LLM Only' response to find relevant contexts from a collection for generating\n       a response. Requires 2 LLM calls.\n    * `hyde2` HyDE + RAG composite - Use the 'HyDE RAG' response to find relevant\n       contexts from a collection for generating a response. Requires 3 LLM calls.\n    * `rag+` Summary RAG - Like RAG, but uses more context and recursive\n       summarization to overcome LLM context limits. Keeps all retrieved chunks, puts\n       them in order, adds neighboring chunks, then uses the summary API to get the\n       answer. Can require several LLM calls.\n    * `all_data` All Data RAG - Like Summary RAG, but includes all document\n       chunks. Uses recursive summarization to overcome LLM context limits.\n       Can require several LLM calls.\n  * `hyde_no_rag_llm_prompt_extension` **(type=string, example=\\\\\\\\nKeep the answer brief, and list the 5 most relevant key words at the end.)** -\n    Add this prompt to every user's prompt, when generating answers to be used for subsequent retrieval during HyDE.\n    Only used when rag_type is `hyde1` or `hyde2`.\n  * `num_neighbor_chunks_to_include` **(type=integer, default=1)** - A number of neighboring chunks to include \n    for every retrieved relevant chunk. It helps to keep surrounding context together. Only enabled for rag_type `rag+`.\n  * `meta_data_to_include` **(type=map)** - A map with flags that indicate whether each piece of document metadata \n    is to be included as part of the context for a chat with a collection.\n    * `name` **(type: boolean, default=True)**\n    * `text` **(type: boolean, default=True)**\n    * `page` **(type: boolean, default=True)**\n    * `captions` **(type: boolean, default=True)**\n    * `uri` **(type: boolean, default=False)**\n    * `connector` **(type: boolean, default=False)**\n    * `original_mtime` **(type: boolean, default=False)**\n    * `age` **(type: boolean, default=False)**\n    * `score` **(type: boolean, default=False)**\n  * `rag_max_chunks` **(type=integer, default=-1)** - Maximum number of document chunks to retrieve for RAG.\n    Actual number depends on rag_type and admin configuration. Set to >0 values to enable. \n    Can be combined with rag_min_chunk_score.\n  * `rag_min_chunk_score` **(type=double, default=0.0)** - Minimum score of document chunks to retrieve for RAG.\n    Set to >0 values to enable. Can be combined with rag_max_chunks.\n  * `graph_rag_auto_select` **(type=boolean, default=true)** - When `rag_type` is `auto` and the collection has\n    a successfully built knowledge graph, auto-select `graph_rag` as the rag_type for the chat. Set to `false`\n    to keep auto on normal RAG even when a graph exists, e.g. when an admin wants to retain control over when\n    graph mode becomes the default.\n"
    DeleteCollectionsJobRequest:
      type: object
      required:
      - collection_ids
      properties:
        collection_ids:
          description: Ids of collections to be deleted.
          type: array
          items:
            type: string
    Collection:
      required:
      - id
      - name
      - description
      - embedding_model
      - document_count
      - document_size
      - created_at
      - updated_at
      - user_count
      - is_public
      - username
      - sessions_count
      - status
      type: object
      properties:
        id:
          description: A unique identifier of the collection
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          description: Name of the collection
          type: string
          example: My sci-fi library
        description:
          description: Description of the collection
          type: string
          example: Collection of my favourite sci-fi books
        embedding_model:
          type: string
          example: BAAI/bge-large-en-v1.5
        document_count:
          description: A number of documents in the collection
          type: integer
        document_size:
          description: Total size in bytes of all documents in the collection
          type: integer
        created_at:
          description: Time when the collection was created
          type: string
          format: date-time
        updated_at:
          description: Last time when the collection was modified
          type: string
          format: date-time
        user_count:
          description: A number of users having access to the collection
          type: integer
        is_public:
          description: Is publicly accessible
          type: boolean
        username:
          description: Name of the user owning the collection
          type: string
        sessions_count:
          description: A number of chat sessions with the collection
          type: integer
        status:
          description: Status of the collection
          type: string
        prompt_template_id:
          description: A unique identifier of a prompt template associated with the collection.
          type: string
          example: 4e400991-c459-455f-995c-dc6f55ffdb90
        thumbnail:
          description: A file name of a thumbnail image.
          type: string
        size_limit:
          description: Maximum size of data that could be contained in the collection.
          type: integer
        expiry_date:
          description: An expiry date
          type: string
          format: date-time
        inactivity_interval:
          description: The inactivity interval as an integer number of days.
          type: integer
        rag_type:
          description: "RAG type options:\n  * `auto` - Automatically select the best rag_type.\n  * `llm_only` LLM Only - Answer the query without any supporting document contexts.\n  Requires 1 LLM call.\n  * `rag` RAG (Retrieval Augmented Generation) - Use supporting document contexts\n  to answer the query. Requires 1 LLM call.\n  * `hyde1` LLM Only + RAG composite - HyDE RAG (Hypothetical Document Embedding).\n  Use 'LLM Only' response to find relevant contexts from a collection for generating\n  a response. Requires 2 LLM calls.\n  * `hyde2` HyDE + RAG composite - Use the 'HyDE RAG' response to find relevant\n  contexts from a collection for generating a response. Requires 3 LLM calls.\n  * `rag+` Summary RAG - Like RAG, but uses more context and recursive\n  summarization to overcome LLM context limits. Keeps all retrieved chunks, puts\n  them in order, adds neighboring chunks, then uses the summary API to get the\n  answer. Can require several LLM calls.\n  * `all_data` All Data RAG - Like Summary RAG, but includes all document\n  chunks. Uses recursive summarization to overcome LLM context limits.\n  Can require several LLM calls.\n"
          type: string
          enum:
          - auto
          - llm_only
          - rag
          - hyde1
          - hyde2
          - rag+
          - all_data
        metadata_dict:
          $ref: '#/components/schemas/Metadata'
        workspace:
          description: The workspace associated with the collection.
          type: string
        has_default_guardrails:
          description: Whether this collection was created with default guardrails enabled.
          type: boolean
        vex_encryption:
          description: 'The per-collection vector encryption choice that was set at creation: `enabled`, `disabled`, or null when the collection follows the server default. Read-only — cannot be changed after creation.

            '
          type:
          - string
          - 'null'
          enum:
          - enabled
          - disabled
    MigrateCollectionChatSessionsJobRequest:
      type: object
      required:
      - target_collection_id
      properties:
        target_collection_id:
          description: The UUID of the target collection to migrate chat sessions to.
          type: string
    TagFilter:
      type: object
      description: "Filter for document tags supporting inclusion and exclusion.\n\nNote: The exclude list takes priority over the include list. If a document has a tag\nthat appears in both lists, the document will be excluded.\n\nExamples:\n  - Include only documents with 'red' OR 'blue' tags: {\"include\": [\"red\", \"blue\"]}\n  - Exclude documents with 'red' OR 'blue' tags: {\"exclude\": [\"red\", \"blue\"]}\n  - Include documents with 'color' tag BUT exclude 'red' and 'blue': {\"include\": [\"color\"], \"exclude\": [\"red\", \"blue\"]}\n"
      properties:
        include:
          type: array
          items:
            type: string
          description: Include documents with ANY of these tags (OR operation).
        exclude:
          type: array
          items:
            type: string
          description: Exclude documents with ANY of these tags (OR operation). Takes priority over include.
    ChatSettings:
      type: object
      properties:
        llm:
          type: string
          description: LLM name to send the query. Use "auto" for automatic model routing, set cost_controls of llm_args for detailed control over automatic routing.
        llm_args:
          $ref: '#/components/schemas/ChatCompletionRequestLLMArgs'
        self_reflection_config:
          $ref: '#/components/schemas/ChatCompletionSelfReflectionConfig'
        rag_config:
          $ref: '#/components/schemas/ChatCompletionRAGConfig'
        include_chat_history:
          type: string
          enum:
          - 'on'
          - 'off'
          - auto
          description: Whether to include chat history. Includes previous questions and answers for the current chat session for each new chat request. Disable if require deterministic answers for a given question.
        tags:
          oneOf:
          - type: array
            items:
              type: string
          - $ref: '#/components/schemas/TagFilter'
          description: "Filter documents by tags for RAG context. Supports two formats:\n  - Array format (backward compatible): [\"red\", \"blue\"] includes documents with 'red' OR 'blue' tags\n  - Object format (with exclusions): {\"include\": [\"color\"], \"exclude\": [\"red\", \"blue\"]}\n"
    ChunkSearchResult:
      allOf:
      - $ref: '#/components/schemas/Chunk'
      - type: object
        required:
        - topic
        - score
        properties:
          topic:
            type: string
          score:
            type: number
            format: double
    SharePermission:
      required:
      - username
      type: object
      properties:
        username:
          type: string
        permissions:
          type: array
          items:
            type: string
    ChatCompletionSelfReflectionConfig:
      type: object
      description: "A map with self reflection settings:\n  * `llm_reflection` **(type=string, example=gpt-4-0613)**\n  * `prompt_reflection` **(type=string, example=\\\"\\\"\\\"Prompt:\\\\\\\\n%s\\\\\\\\n\\\"\\\"\\\"\\\\\\\\n\\\\\\\\n\\\"\\\"\\\")**\n  * `system_prompt_reflection` **(type=string)**\n  * `llm_args_reflection` **(type=string, example={})**\n"
      additionalProperties: true
    Metadata:
      type: object
      additionalProperties: true
    ChatCompletionRequestLLMArgs:
      type: object
      description: "A map of arguments sent to LLM with query.\n  * `temperature` **(type=double, default=0.0)** - A value used to modulate the next token probabilities.\n    0 is the most deterministic and 1 is most creative.\n  * `top_k` **(type=integer, default=1)** - A number of highest probability vocabulary tokens to keep for top-k-filtering.\n  * `top_p` **(type=double, default=0.0)** - If set to a value < 1, only the smallest set of most probable\n    tokens with probabilities that add up to top_p or higher are kept for generation.\n  * `seed` **(type=integer, default=0)** - A seed for the random number generator when sampling during\n     generation (if temp>0 or top_k>1 or top_p<1), seed=0 picks a random seed.\n  * `repetition_penalty` **(type=double, default=1.07)** - A parameter for repetition penalty. 1.0 means no penalty.\n  * `max_new_tokens` **(type=double, default=1024)** - A maximum number of new tokens to generate.\n    This limit applies to each (map+reduce) step during summarization and each (map) step during extraction.\n  * `min_max_new_tokens` **(type=integer, default=512)** - A minimum value for max_new_tokens when auto-adjusting for content of prompt, docs, etc.\n  * `response_format` **(type=enum[text, json_object, json_code], default=text)** - An output type of LLM\n  * `guided_json` **(type=map)** - If specified, the output will follow the JSON schema.\n  * `guided_regex` **(type=string)** - If specified, the output will follow the regex pattern.\n    Only for models that support guided generation.\n  * `guided_choice` **(type=array[string])** - If specified, the output will be exactly one of the choices.\n    Only for models that support guided generation.\n  * `guided_grammar` **(type=string)** - If specified, the output will follow the context free grammar.\n    Only for models that support guided generation.\n  * `guided_whitespace_pattern` **(type=string)** - If specified, will override the default whitespace pattern for guided json decoding.\n    Only for models that support guided generation.\n  * `enable_vision` **(type=enum[on, off, auto], default=auto)** - Controls vision mode,\n    send images to the LLM in addition to text chunks.\n  * `visible_vision_models` **(type=array[string], default=[auto])** - Controls which vision model to use when processing images.\n    Must provide exactly one model. [auto] for automatic.\n  * `images_num_max` **(type=integer, default=None)** - Maximum number of images to process.\n  * `json_preserve_system_prompt` **(type=boolean, default=None)** - Whether to preserve system prompt in JSON response.\n  * `client_metadata` **(type=string, default=None)** - Additional metadata to send with the request.\n  * `min_chars_per_yield` **(type=integer, default=1)** - Minimum characters to yield in streaming response.\n  * `reasoning_effort` **(type=integer, default=0)** - Level of reasoning effort for the model (higher values = deeper reasoning, e.g., 10000-65000).\n    Use for models that support chain-of-thought reasoning. 0 means no additional reasoning effort.\n  * `cost_controls` **(type=map)** A map with cost controls settings:\n    * `max_cost` **(type=double)** - Sets the maximum allowed cost in USD per LLM call when doing Automatic model routing.\n      If the estimated cost based on input and output token counts is higher than this limit,\n      the request will fail as early as possible.\n    * `max_cost_per_million_tokens` **(type=double)** - Only consider models that cost less than this value in USD per million tokens\n      when doing automatic routing. Using the max of input and output cost.\n    * `model` **(type=array[string])** - Optional subset of models to consider when doing automatic routing.\n      If not specified, all models are considered.\n    * `willingness_to_pay` **(type=double)** - Controls the willingness to pay extra for a more accurate model for every LLM call\n      when doing automatic routing, in units of USD per +10% increase in accuracy.\n      We start with the least accurate model. For each more accurate model,\n      we accept it if the increase in estimated cost divided by the increase in estimated accuracy\n      is no more than this value divided by 10%, up to the upper limit specified above.\n      Lower values will try to keep the cost as low as possible,\n      higher values will approach the cost limit to increase accuracy. 0 means unlimited.\n    * `willingness_to_wait` **(type=double)** - Controls the willingness to wait longer for a more accurate model for every LLM call\n      when doing automatic routing, in units of seconds per +10% increase in accuracy.\n      We start with the least accurate model. For each more accurate model,\n      we accept it if the increase in estimated time divided by the increase in estimated accuracy\n      is no more than this value divided by 10%. Lower values will try to keep the time\n      as low as possible, higher values will take longer to increase accuracy. 0 means unlimited.\n  * `use_agent` **(type=boolean, default=False)** - If True, use the AI agent (with access to tools) to generate the response.\n  * `agent_accuracy` **(type=string, default=\"standard\")** - Effort level by the agent. Only if use_agent=True. One of [\"quick\", \"basic\", \"standard\", \"maximum\"].\n  * `agent_max_turns` **(type=union[string, integer], default=\"auto\")** - Optional max. number of back-and-forth turns with the agent. Only if use_agent=True. Either \"auto\" or an integer.\n  * `agent_tools` **(type=union[string, array[string]], default=\"auto\")** - Either \"auto\", \"all\", \"any\" to enable all available tools, or a specific list of tools to use. Only if use_agent=True.\n  * `agent_type` **(type=string, default=\"auto\")** - Type of agent to use for task processing.\n  * `agent_original_files` **(type=array[string], default=None)** - List of file paths for agent to process.\n  * `agent_timeout` **(type=integer, default=None)** - Timeout in seconds for each agent turn.\n  * `agent_total_timeout` **(type=integer, default=3600)** - Total timeout in seconds for all agent processing.\n  * `agent_code_writer_system_message` **(type=string, default=None)** - System message for agent code writer.\n  * `agent_num_executable_code_blocks_limit` **(type=integer, default=1)** - Maximum number of executable code blocks.\n  * `agent_system_site_packages` **(type=boolean, default=True)** - Whether agent has access to system site packages.\n  * `agent_main_model` **(type=string, default=None)** - Main model to use for agent.\n  * `agent_max_stream_length` **(type=integer, default=None)** - Maximum stream length for agent response.\n  * `agent_max_memory_usage` **(type=integer, default=16*1024**3)** - Maximum memory usage for agent in bytes (16GB default).\n  * `agent_main_reasoning_effort` **(type=integer, default=None)** - Effort level for main reasoning.\n  * `agent_advanced_reasoning_effort` **(type=integer, default=None)** - Effort level for advanced reasoning.\n  * `agent_max_confidence_level` **(type=integer, default=None)** - Maximum confidence level for agent responses.\n  * `agent_planning_forced_mode` **(type=boolean, default=None)** - Whether to force planning mode for agent.\n  * `agent_too_soon_forced_mode` **(type=boolean, default=None)** - Whether to force \"too soon\" mode for agent.\n  * `agent_critique_forced_mode` **(type=integer, default=None)** - Whether to force critique mode for agent.\n  * `agent_query_understanding_parallel_calls` **(type=integer, default=None)** - Number of parallel calls for query understanding.\n  * `task_tracking` **(type=boolean, default=None)** - Enable task tracking for agent.\n  * `task_update_steps` **(type=integer, default=None)** - Number of steps for task update tracking (0-5, None for auto).\n  * `tool_building_mode` **(type=string, default=None)** - Mode for tool building configuration.\n  * `agent_stream_files` **(type=boolean, default=True)** - Whether to stream files from agent.\n  * `final_answer_guidelines_mode` **(type=string, default=\"auto\")** - Mode for formatting agent final answers. Only applies when use_agent=True. Options: \"auto\" (chooses detailed, may later adapt), \"detailed\" (full final answer guidelines), \"detailed_no_file_links\", \"detailed_no_image_links\", \"detailed_no_links\", \"file_template\" (use custom template), \"raw_LLM\" (bypass final answer guidelines). Available modes may vary by deployment.\n"
      additionalProperties: true
    CollectionCreateRequest:
      required:
      - name
      - description
      type: object
      properties:
        name:
          type: string
          example: My sci-fi library
        description:
          type: string
          example: Collection of my favourite sci-fi books
        embedding_model:
          type: string
          example: BAAI/bge-large-en-v1.5
        collection_settings:
          $ref: '#/components/schemas/CollectionSettings'
        chat_settings:
          $ref: '#/components/schemas/ChatSettings'
        expiry_date:
          type: string
          format: date-time
          description: Optional expiration date for the collection
          example: 2024-12-31 23:59:59+00:00
        workspace:
          type: string
        vex_encryption:
          type: string
          enum:
          - enabled
          - disabled
          description: "Per-collection vector encryption choice, honored at create time only:\n  * `enabled` — store vectors encrypted (server must have a vector\n    encryption provider configured; the collection cannot later be\n    opened on a server with no provider).\n  * `disabled` — store vectors as plaintext, even if the server has\n    encryption enabled by default.\n  * omitted — fall back to the server-level default\n    (`H2OGPTE_VEX_ENCRYPTION_ENABLED`).\nSticky once any data is written: existing collections cannot switch modes after the first write.\n"
          example: enabled
    Chunk:
      type: object
      required:
      - id
      - text
      - name
      - size
      - pages
      properties:
        text:
          description: The text represented by the chunk
          type: string
        id:
          description: The identifier of the chunk
          type: integer
        name:
          type: string
        size:
          description: The size in bytes.
          type: integer
        pages:
          type: string
    Count:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
    GuardrailsSettings:
      type: object
      properties:
        exception_message:
          description: A message that will be returned in case some guardrails settings are violated.
          type: string
        show_violated_responses:
          description: Admin-only toggle to view the exact content of violated responses. When enabled, admins can see what triggered a guardrail violation. This is disabled by default for privacy and security. Only administrators can enable this setting and view violated content.
          type: boolean
          default: false
        guardrails_on_transcriptions:
          description: When enabled, audio and video transcriptions are checked for content safety violations using the guardrails LLM, in addition to the existing PII detection.
          type: boolean
          default: false
        vision_guardrails_enabled:
          description: When enabled, images and video frames are checked for content safety violations using a vision-capable guardrails LLM during document ingestion.
          type: boolean
          default: false
        guardrails_vision_llm:
          description: Vision-capable LLM for image and video content safety checks. Defaults to auto which selects the best available vision model.
          type: string
          default: auto
        column_redaction_config:
          type: array
          description: List of [column_pattern, redaction_label], both strings.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        disallowed_regex_patterns:
          description: A list of regular expressions that match custom PII.
          type: array
          items:
            type: string
          example:
          - secret_disallowed_word
          - (?!0{3})(?!6{3})[0-8]\d{2}-(?!0{2})\d{2}-(?!0{4})\d{4}
        presidio_labels_to_flag:
          description: A list of entities to be flagged as PII by the built-in Presidio model.
          type: array
          items:
            type: string
          example:
          - IBAN_CODE
          - US_SSN
        pii_labels_to_flag:
          description: A list of entities to be flagged as PII by the built-in PII model.
          type: array
          items:
            type: string
          example:
          - IBAN
          - SSN
        pii_detection_parse_action:
          description: What to do when PII is detected during parsing of documents. The 'redact' option will replace disallowed content in the ingested documents with redaction bars.
          type: string
          enum:
          - allow
          - redact
          - fail
        pii_detection_llm_input_action:
          description: What to do when PII is detected in the input to the LLM (document content and user prompts). The 'redact' option will replace disallowed content with placeholders.
          type: string
          enum:
          - allow
          - redact
          - fail
        pii_detection_llm_output_action:
          description: What to do when PII is detected in the output of the LLM. The 'redact' option will replace disallowed content with placeholders.
          type: string
          enum:
          - allow
          - redact
          - fail
        prompt_guard_labels_to_flag:
          description: A list of entities to be flagged as safety violations in user prompts by the built-in prompt guard model.
          type: array
          items:
            type: string
          example:
          - JAILBREAK
        guardrails_labels_to_flag:
          description: A list of entities to be flagged as safety violations in user prompts. Must be a subset of guardrails_entities, if provided.
          type: array
          items:
            type: string
          example:
          - Violent Crimes
          - Non-Violent Crimes
          - Intellectual Property
          - Code Interpreter Abuse
        guardrails_llm:
          description: LLM to use for Guardrails and PII detection
          type: string
          example: h2oai/h2o-danube3-4b-chat
        guardrails_safe_category:
          description: Name of the safe category for guardrails. Must be a key in guardrails_entities, if provided. Otherwise uses system defaults.
          type: string
          example: Safe
        guardrails_entities:
          description: Dictionary of entities and their descriptions for the guardrails model to classify. The first entry is the "safe" class, the rest are "unsafe" classes.
          type: object
          additionalProperties:
            type: string
          example:
            Safe: Messages that do not contain any of the following unsafe content
            Violent Crimes: 'Messages that enable, encourage, or endorse the commission of violent crimes, including: (1) unlawful violence toward people (ex: terrorism, genocide, murder, hate-motivated violent crimes, child abuse, assault, battery, kidnapping) and (2) unlawful violence toward animals (ex: animal abuse)'
            Non-Violent Crimes: 'Messages that enable, encourage, or endorse the commission of non-violent crimes, including: (1) personal crimes (ex: labor trafficking, threats, intimidation, hate-motivated non-violent crimes), (2) financial crimes (ex: fraud, scams, money laundering), (3) property crimes (ex: theft, arson, vandalism), (4) drug crimes (ex: creating or using regulated substances), (5) weapons crimes (ex: producing unlicensed firearms), and (6) cyber crimes (ex: hacking)'
            Defamation: Messages that are both verifiably false and likely to injure a living person’s reputation
            Specialized Advice: Messages that contain specialized financial, medical, or legal advice, or that indicate dangerous activities or objects are safe
            Intellectual Property: Messages that may violate the intellectual property rights of any third party
            Code Interpreter Abuse: Messages that seek to abuse code interpreters, including those that enable denial of service attacks, container escapes or privilege escalation exploits
        column_redaction_custom_entities_to_flag:
          description: Deprecated - Use custom_pii_entities_to_flag. A list of entities to redact in tabular data files. Must be a subset of column_redaction_custom_entities, if provided.
          type: array
          items:
            type: string
          example:
          - Mother's Maiden Name
        column_redaction_custom_entities:
          description: (Optional) Deprecated - Use custom_pii_entities. A dictionary of entities and a short description for the LLM to check for and redact columns containing PII in tabular data files.
          type: object
          additionalProperties:
            type: string
          example:
            Mother's Maiden Name: Mother's maiden name
        custom_pii_entities_to_flag:
          description: A list of entities to redact in tabular data files. Must be a subset of custom_pii_entities, if provided.
          type: array
          items:
            type: string
          example:
          - Mother's Maiden Name
        custom_pii_entities:
          description: (Optional) A dictionary of entities and a short description for the LLM to check for and redact columns containing PII in tabular data files.
          type: object
          additionalProperties:
            type: string
          example:
            Mother's Maiden Name: Mother's maiden name
    CollectionSettings:
      type: object
      properties:
        max_tokens_per_chunk:
          description: Approximate max. number of tokens per chunk for text-dominated document pages. For images, chunks can be larger.
          type: integer
          example: 320
        chunk_overlap_tokens:
          description: Approximate number of tokens that are overlapping between successive chunks.
          type: integer
          example: 0
        gen_doc_summaries:
          description: Whether to auto-generate document summaries (uses LLM)
          type: boolean
          default: false
        gen_doc_questions:
          description: Whether to auto-generate sample questions for each document (uses LLM)
          type: boolean
          default: false
        audio_input_language:
          description: Language of audio files. Defaults to "auto" language detection. Pass empty string to see choices.
          type: string
          default: auto
        ocr_model:
          description: Which method to use to extract text from images using AI-enabled optical character recognition (OCR) models. Pass empty string to see choices. docTR is best for Latin text, PaddleOCR is best for certain non-Latin languages, Tesseract covers a wide range of languages. Mississippi works well on handwriting. auto - Automatic will auto-select the best OCR model for every page. off - Disable OCR for speed, but all images will then be skipped (also no image captions will be made).
          type: string
          default: auto
        tesseract_lang:
          description: Which language to use when using ocr_model="tesseract". Pass empty string to see choices.
          type: string
        keep_tables_as_one_chunk:
          description: When tables are identified by the table parser the table tokens will be kept in a single chunk.
          type: boolean
        chunk_by_page:
          description: Each page will be a chunk. `keep_tables_as_one_chunk` will be ignored if this is `true`.
          type: boolean
        handwriting_check:
          description: Check pages for handwriting. Will use specialized models if handwriting is found.
          type: boolean
        ingest_mode:
          description: Default document ingestion mode for uploads.
          type: string
          enum:
          - standard
          - lite
          - agent_only
        follow_links:
          description: Whether to import all web pages linked from this URL will be imported. External links will be ignored. Links to other pages on the same domain will be followed as long as they are at the same level or below the URL you specify. Each page will be transformed into a PDF document.
          type: boolean
        max_depth:
          description: Max depth of recursion when following links, only when follow_links is `true`. Max_depth of 0 means don't follow any links, max_depth of 1 means follow only top-level links, etc. Use -1 for automatic (system settings).
          type: integer
        max_documents:
          description: Max number of documents when following links, only when follow_links is `true`. Use None for automatic (system defaults). Use -1 for max (system limit).
          type: integer
        root_dir:
          description: Root directory for document storage
          type: string
        copy_document:
          description: Whether to copy the document when importing an existing document
          type: boolean
        guardrails_settings:
          $ref: '#/components/schemas/GuardrailsSettings'
    PromptTemplateChangeRequest:
      required:
      - prompt_template_id
      type: object
      properties:
        prompt_template_id:
          type: string
    JobDetails:
      required:
      - id
      - name
      - overall_status
      - passed_percentage
      - failed_percentage
      - progress
      - created_at
      - updated_at
      - kind
      - statuses
      - errors
      - duration
      - duration_seconds
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        overall_status:
          type: string
          enum:
          - in progress
          - completed
          - failed
          - canceled
        status:
          type: string
        passed_percentage:
          type: number
          format: double
        failed_percentage:
          type: number
          format: double
        progress:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        kind:
          type: string
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/JobDetailsStatus'
        errors:
          type: array
          items:
            type: string
        duration:
          type: string
        duration_seconds:
          type: number
          format: double
        canceled_by:
          type: string
        cancel_reason:
          type: string
        timeout:
          type: number
          format: double
        start_time:
          type: number
          format: double
    SuggestedQuestion:
      required:
      - question
      type: object
      properties:
        question:
          type: string
    EndpointError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message
    ShareCollectionRequest:
      type: object
      properties:
        permissions:
          description: Individual permission levels defining the sharing rule.
          type: array
          items:
            type: string
    Document:
      required:
      - id
      - name
      - username
      - type
      - size
      - page_count
      - created_at
      - updated_at
      - status
      type: object
      properties:
        id:
          description: A unique identifier of the document
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          description: Name of the document
          type: string
          example: The Hitchhiker's Guide to the Galaxy
        username:
          description: A username owning the document
          type: string
        type:
          description: Type of the document
          type: string
        size:
          description: Size of the document in bytes
          type: integer
        page_count:
          description: A number of pages contained in the document
          type: integer
        status:
          description: Status of the document
          type: string
          enum:
          - unknown
          - scheduled
          - queued
          - running
          - completed
          - failed
          - canceled
          - agent_only
        usage_stats:
          description: Usage stats
          type: string
        connector:
          type: string
        original_type:
          type: string
        original_mtime:
          type: string
          format: datetime
        created_at:
          description: Time when document was created
          type: string
          format: date-time
        updated_at:
          description: Last time when document was modified
          type: string
          format: date-time
        uri:
          type: string
        summary:
          type: string
        summary_parameters:
          type: string
        metadata_dict:
          $ref: '#/components/schemas/Metadata'
        is_encrypted:
          description: Whether the document files are encrypted at rest
          type: boolean
          default: false
    ChatSession:
      required:
      - id
      - updated_at
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        name:
          type: string
          example: Discussion about sci-fi heroes.
        collection_id:
          type: string
          example: c91e7c84-65df-4b43-ba15-fbd3afb2e86f
        collection_name:
          type: string
        prompt_template_id:
          type: string
          example: 4e400991-c459-455f-995c-dc6f55ffdb90
        latest_message_content:
          type: string
          example: The strongest hero is superman!
        updated_at:
          type: string
          format: date-time
        workspace:
          type: string
        username:
          type: string
          description: Username of the session owner.
    DeleteDocumentsJobRequest:
      type: object
      required:
      - document_ids
      properties:
        document_ids:
          description: Ids of documents to be deleted.
          type: array
          items:
            type: string
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    RequestEntityTooLarge:
      description: Request entity is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
  parameters:
    CopyLifecycleSettings:
      name: copy_lifecycle_settings
      in: query
      description: 'Whether to copy lifecycle settings (expiry_date, inactivity_interval, size_limit)

        from the source collection to the target collection.

        '
      schema:
        type: boolean
        default: false
    SkipReparse:
      name: skip_reparse
      in: query
      description: 'Whether to skip re-parsing documents and only re-embed existing chunks with the

        target collection''s embedding model. Much faster than full import since it skips

        file fetch, PDF conversion, OCR, and chunking. Only re-embeds the text chunks.

        Cannot be combined with copy_document=true.

        '
      schema:
        type: boolean
        default: false
    PreserveDocumentStatus:
      name: preserve_document_status
      in: query
      description: Whether to preserve each document's original ingest mode (agent_only vs standard) when importing. When true, documents with agent_only status remain agent_only in the target collection. When false (default), all documents use the ingest_mode parameter uniformly.
      schema:
        type: boolean
    IngestionParameterTesseractLang:
      name: tesseract_lang
      in: query
      description: Which language to use when using ocr_model="tesseract".
      schema:
        type: string
    CopyDocument:
      name: copy_document
      in: query
      description: Whether to save a new copy of the document
      schema:
        type: boolean
    IngestionParameterIngestMode:
      name: ingest_mode
      in: query
      description: Ingest mode to use. - `standard` - Files will be ingested for use with RAG - `agent_only` - Bypasses standard ingestion. Files can only be used with agents.
      schema:
        type: string
        enum:
        - standard
        - agent_only
    IngestionParameterGenDocQuestions:
      name: gen_doc_questions
      in: query
      description: Whether to auto-generate sample questions for each document (uses LLM).
      schema:
        type: boolean
        default: false
    Timeout:
      name: timeout
      in: query
      description: Timeout in seconds
      schema:
        type: number
        format: double
    IngestionParameterGenDocSummaries:
      name: gen_doc_summaries
      in: query
      description: Whether to auto-generate document summaries (uses LLM).
      schema:
        type: boolean
        default: false
    IngestionParameterHandwritingCheck:
      name: handwriting_check
      in: query
      description: Check pages for handwriting. Will use specialized models if handwriting is found.
      schema:
        type: boolean
    IngestionParameterKeepTablesAsOneChunk:
      name: keep_tables_as_one_chunk
      in: query
      description: When tables are identified by the table parser the table tokens will be kept in a single chunk.
      schema:
        type: boolean
    MigrateScheduledConnectors:
      name: migrate_scheduled_connectors
      in: query
      description: 'Whether to move scheduled connectors from the source collection to the target collection

        after documents are imported. The source collection will have no scheduled connectors

        after this operation. Only the owner of both collections can use this flag.

        '
      schema:
        type: boolean
        default: false
    PreserveMetadata:
      name: preserve_metadata
      in: query
      description: Whether to preserve document metadata when copying documents.
      schema:
        type: boolean
        default: false
    IngestionParameterOcrModel:
      name: ocr_model
      in: query
      description: Which method to use to extract text from images using AI-enabled optical character recognition (OCR) models. docTR is best for Latin text, PaddleOCR is best for certain non-Latin languages, Tesseract covers a wide range of languages. Mississippi works well on handwriting. - `auto` - Automatic will auto-select the best OCR model for every page. - `off` - Disable OCR for speed, but all images will then be skipped (also no image captions will be made).
      schema:
        type: string
        default: auto
    IngestionParameterChunkByPage:
      name: chunk_by_page
      in: query
      description: Each page will be a chunk. `keep_tables_as_one_chunk` will be ignored if this is `true`.
      schema:
        type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Using an API key generated by H2OGPTe
