      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config_type:
                  type: string
                  description: Type of config ('runner' or 'creator')
                  default: runner
                server_names:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Optional list of server names to filter
                mcp_dir:
                  type:
                  - string
                  - 'null'
                  description: Override directory for MCP configs
                include_remote:
                  type: boolean
                  description: Whether to include remote MCP servers
                  default: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  servers:
                    type: object
                  total_servers:
                    type: integer
                  total_tools:
                    type: integer
