  /agents/mcp/inspect_tool:
    post:
      operationId: inspect_mcp_tool
      summary: Unified MCP tool inspection
      description: 'Unified endpoint for inspecting MCP tools. Supports three modes: (1) tool_id — inspect an existing local or remote MCP tool by database ID, (2) servers — inspect one or more remote MCP server configs (pre-add), (3) file_name + file_data_base64 — inspect an uploaded package (pre-add). Returns a list of per-server inspection results.

        '
      tags:
      - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_id:
                  type:
                  - string
                  - 'null'
                  description: ID of an existing MCP tool to inspect
                servers:
                  type:
                  - object
                  - 'null'
                  description: Map of server_name to server config for pre-add remote inspection
                  additionalProperties:
                    type: object
                file_name:
                  type:
                  - string
                  - 'null'
                  description: Filename for pre-add upload inspection
                file_data_base64:
                  type:
                  - string
                  - 'null'
                  description: Base64-encoded file content for pre-add upload inspection
                model:
                  type:
                  - string
                  - 'null'
                  description: LLM model for security inspection
      responses:
        '200':
          description: Unified inspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  servers:
                    type: array
                    description: Per-server inspection results
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        server_name:
                          type: string
                        server_type:
                          type: string
                        tools:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              description:
                                type: string
                              parameters:
                                type: object
                        tool_count:
                          type: integer
                        security:
                          type:
                          - object
                          - 'null'
                        error:
                          type:
                          - string
                          - 'null'
                        detection_method:
                          type: string
                  error:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Unexpected'
  /agents/mcp/list_tools:
    post:
      operationId: list_mcp_tools
      summary: List tools from MCP servers
      description: 'Lists tools from configured MCP servers, optionally filtered by config type and server names.

        '
