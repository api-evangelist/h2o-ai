components:
  schemas:
    AgentKeyAssociation:
      type: object
      properties:
        name:
          type: string
          description: Environment variable name (env_key_name)
        associated_key:
          type:
          - object
          - 'null'
          description: Associated agent key details if key is assigned
          properties:
            id:
              type: string
              format: uuid
              description: Agent key ID
            name:
              type: string
              description: Agent key name
            owner_email:
              type: string
              description: Agent key owner email
            description:
              type: string
              description: Agent key description
    CustomAgentSuggestionMcpServer:
      required:
      - tool_name
      - tool_args
      type: object
      properties:
        tool_name:
          type: string
          description: MCP server name from agent metadata
        tool_args:
          type: string
          description: JSON string containing tool configuration (empty if unresolved)
    CustomAgentKeyAssociation:
      required:
      - id
      - agent_id
      - env_key_name
      - user_id
      - requirement_type
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Association UUID
        agent_id:
          type: string
          format: uuid
          description: Custom agent UUID
        env_key_name:
          type: string
          description: Env var name (from envs.json or user-added)
        key_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Agent key UUID (null for placeholder associations)
        user_id:
          type: string
          format: uuid
          description: User UUID who owns the association
        requirement_type:
          type: string
          enum:
          - required
          - optional_with_default
          - optional_no_default
          - custom
          description: From envs.json value or custom if assigned after the fact
        key_name:
          type:
          - string
          - 'null'
          description: Agent key name
        owner_email:
          type:
          - string
          - 'null'
          description: Agent key owner email
    UpdateAgentKeyRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - private
          - shared
        value:
          type: string
        description:
          type: string
    KeyAssociation:
      required:
      - name
      - key_id
      type: object
      properties:
        name:
          type: string
        key_id:
          type: string
        associate_id:
          type: string
        user_id:
          type: string
        email:
          type: string
    AgentToolSpecApiKeys:
      required:
      - required
      - optional
      - internal
      description: The specific keys associated with an agent tool.
      type: object
      properties:
        required:
          description: List of required keys set for the tool to function.
          type: array
          items:
            type: string
        optional:
          description: The tool can still operate even if these keys are not set.
          type: array
          items:
            type: string
        internal:
          description: Keys that are managed internally by the system.
          type: array
          items:
            type: string
    UpdateCustomAgentToolRequest:
      required:
      - tool_args
      type: object
      properties:
        tool_args:
          type: object
          description: The new arguments for the custom agent tool
    CustomAgentSuggestion:
      type: object
      properties:
        mcp_servers:
          type: array
          items:
            $ref: '#/components/schemas/CustomAgentSuggestionMcpServer'
          description: List of MCP server suggestions with tool configurations
    CreateAgentToolKeyAssociationsRequest:
      required:
      - tool
      - keys
      type: object
      properties:
        tool:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/NewKeyAssociation'
    AgentServerDirectoryStatsPerAgentChatSession:
      required:
      - agent_chat_session_id
      - chat_preview
      - stats
      type: object
      properties:
        agent_chat_session_id:
          type: string
        chat_preview:
          type: string
        stats:
          type: array
          items:
            $ref: '#/components/schemas/AgentServerDirectoryStats'
    DeleteCustomAgentKeyAssociationsResponse:
      required:
      - deleted_count
      type: object
      properties:
        deleted_count:
          type: integer
          description: Number of associations deleted
    AgentServerDirectoryStats:
      required:
      - id
      - object
      - size_bytes
      - size_human_readable
      - file_count
      - directory_count
      - created_timestamp
      - modified_timestamp
      - created_date
      - modified_date
      - is_empty
      - top_level_contents
      - owner
      - permissions
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
        size_bytes:
          type: integer
        size_human_readable:
          type: string
        file_count:
          type: integer
        directory_count:
          type: integer
        created_timestamp:
          type: number
        modified_timestamp:
          type: number
        created_date:
          type: string
        modified_date:
          type: string
        is_empty:
          type: boolean
        top_level_contents:
          type: array
          items:
            type: string
        owner:
          type: string
        permissions:
          type: string
        files:
          description: Only populated when detail_level > 0
          type: array
          items:
            $ref: '#/components/schemas/AgentServerDirectoryFileStats'
    AgentServerDirectoryFileStats:
      required:
      - name
      - path
      - size_bytes
      - size_human_readable
      - created_timestamp
      - modified_timestamp
      - created_date
      - modified_date
      - is_directory
      - owner
      - permissions
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        path:
          type: string
        size_bytes:
          type: integer
        size_human_readable:
          type: string
        created_timestamp:
          type: number
        modified_timestamp:
          type: number
        created_date:
          type: string
        modified_date:
          type: string
        is_directory:
          type: boolean
        owner:
          description: Unix systems only
          type: string
        permissions:
          description: Unix systems only
          type: string
        sha256:
          description: Only for files, not directories
          type: string
    AgentToolSpec:
      required:
      - name
      - description
      - enabled
      - default
      - extendable
      - api_keys
      type: object
      properties:
        name:
          description: The identifier representing the specific tool.
          type: string
        description:
          description: Description of the tool.
          type: string
        enabled:
          description: Specifies whether the tool is currently enabled in H2OGPT.
          type: boolean
        default:
          description: Specifies if the tool is pre-selected by default when available.
          type: boolean
        extendable:
          description: Specifies whether the tool supports custom API keys
          type: boolean
        api_keys:
          $ref: '#/components/schemas/AgentToolSpecApiKeys'
    AgentKey:
      required:
      - name
      - type
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - private
          - shared
          - built_in
        description:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        owner_email:
          type: string
    CreateCustomAgentToolAssociationRequest:
      required:
      - agent_id
      - mcp_server_name
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
          description: Custom agent UUID
        mcp_server_name:
          type: string
          description: MCP server name
        tool_name:
          type:
          - string
          - 'null'
          description: Tool name to associate (null for unresolved)
    CreateCustomAgentKeyAssociationRequest:
      required:
      - agent_id
      - env_key_name
      - key_id
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
          description: Custom agent UUID
        env_key_name:
          type: string
          description: Env var name (from envs.json or user-added)
        key_id:
          type: string
          format: uuid
          description: Agent key UUID to associate
    DeleteCustomAgentToolAssociationsResponse:
      required:
      - deleted_count
      type: object
      properties:
        deleted_count:
          type: integer
          description: Number of associations deleted
    CreateAgentKeyRequest:
      required:
      - name
      - type
      - value
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - private
          - shared
        value:
          type: string
        description:
          type: string
    Agent:
      type: object
      properties:
        id:
          type: string
          description: Agent ID (UUID for custom agents, string like "general-agent" for built-in)
        value:
          type: string
          description: Agent identifier (agent_type for built-in, agent_name for custom)
        label:
          type: string
          description: Display name for the agent
        enabled:
          type: boolean
          description: Whether the agent is enabled (true if all required keys are associated)
        type:
          type: string
          enum:
          - built_in
          - langgraph
          - crewai
          - openai
          - claude
          description: Agent type
        owner:
          type:
          - string
          - 'null'
          description: Owner email (null for built-in agents)
        description:
          type: string
          description: Agent description
        api_keys:
          type: object
          description: Key associations grouped by requirement type
          properties:
            optional:
              type: array
              description: Optional key associations (with or without defaults)
              items:
                $ref: '#/components/schemas/AgentKeyAssociation'
            required:
              type: array
              description: Required key associations
              items:
                $ref: '#/components/schemas/AgentKeyAssociation'
            custom:
              type: array
              description: Custom key associations (added after agent creation)
              items:
                $ref: '#/components/schemas/AgentKeyAssociation'
        mcp_servers:
          type: array
          description: MCP server associations (only for custom agents)
          items:
            type: object
            properties:
              tool_name:
                type: string
                description: MCP server name from agent metadata
              tool_args:
                type: string
                description: Tool arguments as JSON string
              associated_tool:
                type:
                - object
                - 'null'
                description: Associated tool details if tool is resolved
                properties:
                  id:
                    type: string
                    description: Tool ID
                  name:
                    type: string
                    description: Tool name
                  owner_email:
                    type: string
                    description: Tool owner email
                  description:
                    type: string
                    description: Tool description
    Count:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
    CustomAgentToolAssociation:
      required:
      - id
      - agent_id
      - agent_name
      - mcp_server_name
      - user_id
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Association UUID
        agent_id:
          type: string
          format: uuid
          description: Custom agent UUID
        agent_name:
          type: string
          description: Custom agent name
        tool_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Associated tool UUID (null if unresolved)
        tool_name:
          type:
          - string
          - 'null'
          description: Associated tool name (null if unresolved)
        mcp_server_name:
          type: string
          description: MCP server name
        user_id:
          type: string
          format: uuid
          description: User UUID who owns the association
    UpdateCustomAgentRequest:
      required:
      - agent_args
      type: object
      properties:
        agent_args:
          type: object
          description: The new arguments for the custom agent
        mcp_servers_mapping:
          type:
          - object
          - 'null'
          description: Optional dict mapping MCP server names to tool names (or null)
          additionalProperties:
            type:
            - string
            - 'null'
    AgentToolKeyAssociations:
      required:
      - tool
      - keys
      type: object
      properties:
        tool:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyAssociation'
    EndpointError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message
    CustomAgentDetail:
      type: object
      properties:
        id:
          type: string
          description: The ID of the custom agent
        agent_name:
          type: string
          description: The name of the agent
        agent_type:
          type: string
          description: The type of the agent
        agent_args:
          type: object
          description: The agent arguments
        owner_email:
          type: string
          description: The owner's email
        mcp_servers:
          type:
          - array
          - 'null'
          description: Array of MCP server associations with tool details
          items:
            type: object
            properties:
              tool_name:
                type: string
                description: MCP server name from agent metadata
              tool_args:
                type: string
                description: Tool arguments as JSON string
              associated_tool:
                type:
                - object
                - 'null'
                description: Associated tool details if tool is resolved
                properties:
                  id:
                    type: string
                    description: Tool ID
                  name:
                    type: string
                    description: Tool name
                  owner_email:
                    type: string
                    description: Tool owner email
                  description:
                    type: string
                    description: Tool description
        api_keys:
          type: array
          description: Key associations (env var → agent key) for this agent
          items:
            $ref: '#/components/schemas/CustomAgentKeyAssociation'
    NewKeyAssociation:
      required:
      - name
      - key_id
      type: object
      properties:
        name:
          type: string
        key_id:
          type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Using an API key generated by H2OGPTe
