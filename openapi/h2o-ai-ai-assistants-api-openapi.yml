  /event_types:
    post:
      operationId: create_event_type
      summary: Create a custom event type.
      description: Creates a new custom event type that assistants can subscribe to and emit.
      tags:
      - AI Assistants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreateRequest'
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
    get:
      operationId: list_event_types
      summary: List custom event types.
      description: Lists custom event types. Optionally filter by assistant_id to see subscription status.
      tags:
      - AI Assistants
      parameters:
      - name: assistant_id
        in: query
        schema:
          type: string
          format: uuid
        description: Optional assistant ID to include subscription status for.
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
        description: Maximum number of event types to return (max 1000).
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
        description: Number of event types to skip for pagination.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /event_types/{event_type_id}:
    get:
      operationId: get_event_type
      summary: Get a custom event type by ID.
      tags:
      - AI Assistants
      parameters:
      - name: event_type_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
    delete:
      operationId: delete_event_type
      summary: Delete a custom event type.
      description: Only the creator can delete an event type. Cascades to subscriptions.
      tags:
      - AI Assistants
      parameters:
      - name: event_type_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Unexpected'
  /ai_assistants/{assistant_id}/event_subscriptions:
