generated: '2026-08-04'
method: searched
source: live probes of every H2O.ai host in apis.yml on 2026-08-04
notes: >-
  h2o.ai and www.h2o.ai answer 200 with the full marketing HTML for several /.well-known/
  paths (an AEM catch-all) — those are recorded as html-catchall, NOT as hits. The same is
  true of h2ogpte.genai.h2o.ai (a 2,944-byte SPA login shell answering 200 for every path)
  and wave.h2o.ai (a Docusaurus 404 page served with a 200). The only real /.well-known/
  documents on any H2O host are served from trust.h2o.ai, and they are the vendor's:
  the issuer is https://app.safebase.io/api/mcp — SafeBase, the third-party platform that
  hosts H2O.ai's Trust Center — not an H2O.ai authorization server. They are captured
  verbatim for the record but do not describe H2O.ai API authentication, which is a
  bearer API key (see authentication/h2o-ai-authentication.yml).
