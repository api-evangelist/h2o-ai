apis:
- aid: h2o-ai-enterprise-h2ogpte
  name: Enterprise h2oGPTe REST API
  description: 'The Enterprise h2oGPTe REST API is the machine-readable contract for
    H2O.ai''s private generative-AI platform. It exposes 422 operations across 24 tags
    — Collections, Documents, Document Ingestion, Chat, Shared Chats, Agents, AI Assistants,
    Extractors, GraphRAG, Guardrails, Memory Blocks, Models, Prompt Templates, Jobs,
    Scheduled Tasks, Permissions, API Keys, Secrets, Tags, Forums, Configurations,
    Showcase, Admin Sessions and System — letting clients build collections, ingest
    documents from upload/plain text/website/S3/GCS/Azure Blob, run chat completions
    and agentic sessions, and manage models and access control. Authentication is a
    bearer API key generated from the h2oGPTe Guide.'
  humanURL: https://docs.h2o.ai/enterprise-h2ogpte/rest-api
  baseURL: https://h2ogpte.genai.h2o.ai/api/v1
  tags:
