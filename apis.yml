aid: h2o-ai
name: H2O.ai
description: 'H2O.ai is an open-source artificial-intelligence and machine-learning
  company whose platform spans H2O-3 (a distributed, in-memory ML engine), H2O Driverless
  AI (automatic machine learning), H2O MLOps (model deployment, scoring and monitoring),
  H2O Wave (a Python/R framework for realtime AI apps), H2O LLM Studio, and Enterprise
  h2oGPTe (a private generative-AI, RAG and agent platform). Enterprise h2oGPTe publishes
  a 422-operation OpenAPI 3.0.1 contract covering collections, document ingestion,
  chat, agents, extractors, GraphRAG, guardrails, models, permissions and scheduled
  tasks, and H2O MLOps publishes an OpenAPI contract for its model-scoring endpoints.
  H2O.ai also ships a first-party MCP server that proxies the h2oGPTe REST API to
  agent clients, together with official Python, R, Java and JavaScript client libraries
  distributed via PyPI, CRAN, Maven Central and npm.'
