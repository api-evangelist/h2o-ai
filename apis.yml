- aid: h2o-ai-mlops-scoring
  name: H2O MLOps Scoring REST API
  description: 'The H2O MLOps Scoring REST API is the runtime scoring contract for
    models deployed through H2O MLOps. It exposes seven operations on a deployed model
    endpoint — retrieve the model id, retrieve the model input/output schema, fetch
    a sample request, list scoring capabilities, score rows of tabular data, score
    media (image/audio) payloads, and return Shapley contribution values for a scored
    request. The host is per-deployment, so the published specification carries a
    templated server variable rather than a fixed hostname.'
  humanURL: https://docs.h2o.ai/mlops/model-scoring/mlops-scoring-rest-api
  baseURL: https://docs.h2o.ai/mlops/model-scoring/mlops-scoring-rest-api
  tags:
