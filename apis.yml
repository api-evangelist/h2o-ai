    url: openapi/h2o-ai-mlops-scoring-openapi-original.yml
  - type: Overlay
    url: overlays/h2o-ai-mlops-scoring-overlay.yaml
  - type: Documentation
    url: https://docs.h2o.ai/mlops/
  - type: APIReference
    url: https://docs.h2o.ai/mlops/model-scoring/mlops-scoring-rest-api
- aid: h2o-ai-h2ogpte-mcp
  name: h2oGPTe MCP Server
  description: 'H2OGPTe MCP Server is H2O.ai''s first-party Model Context Protocol
    server for Enterprise h2oGPTe. It runs locally over stdio and proxies traffic to
    the h2oGPTe REST API, generating one MCP tool per REST operationId (GET operations
    can instead be exposed as MCP resources). Endpoint sets are selectable — all,
    all_without_async_ingest (the default), basic, or a custom operationId list — so
    the tool surface is a configurable projection of the same OpenAPI contract.'
  humanURL: https://github.com/h2oai/h2ogpte-mcp-server
  baseURL: https://h2ogpte.genai.h2o.ai/api/v1
  tags:
  - Model Context Protocol
  - AI Agents
