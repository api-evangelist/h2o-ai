  recorded observation, not a criticism — several of these standards are simply not
  applicable to an AI/ML platform.
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    Enterprise h2oGPTe publishes OpenAPI 3.0.1 (422 operations, 224 component schemas) at
    https://h2ogpte.genai.h2o.ai/api-spec.yaml; MLOps Scoring publishes OpenAPI 3.0.0.
- id: openapi-3.1
  conforms: false
