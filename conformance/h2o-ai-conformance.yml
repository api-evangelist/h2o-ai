- id: model-context-protocol
  conforms: true
  evidence: >-
    First-party h2ogpte-mcp-server (github.com/h2oai/h2ogpte-mcp-server, PyPI 0.1.6), built on
    FastMCP, projecting the REST OpenAPI onto MCP tools/resources over stdio. h2oGPTe 1.7.0
    also added native MCP server integration on the platform side.
- id: a2a-agent-card
  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json return 404 or an HTML catch-all
