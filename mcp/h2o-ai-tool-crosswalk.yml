notes: 'The h2oGPTe MCP server is a FastMCP OpenAPI proxy: the tool name IS the REST operationId, so the
  binding is exact rather than semantic and every tool inherits its backing operation''s parameters +
  requestBody as its real inputSchema. The crosswalk below enumerates the `basic` endpoint set verbatim
  from the server''s settings.py, because that is the curated, human-chosen tool surface. The default
  set (`all_without_async_ingest`) projects 412 of the 422 operations, and `all` projects all 422 — so
  under the default configuration the REST-only list is the ten asynchronous ingestion job-starters only.
  Every operationId below was verified to exist in the harvested OpenAPI document.'
