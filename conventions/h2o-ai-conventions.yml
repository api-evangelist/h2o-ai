scope: Enterprise h2oGPTe REST API (the H2O MLOps Scoring API is a per-deployment model endpoint and carries none of these conventions)
authentication:
  style: bearer-api-key
  header: 'Authorization: Bearer sk-...'
  scheme_name: bearerAuth
  key_prefix: sk-
  key_types:
  - name: global
    description: >-
      Created without selecting a Collection. Grants full user impersonation and system-wide
      access to every Collection, Document, Chat and setting belonging to that user.
  - name: collection-specific
    description: >-
      Created against one Collection. Permits only chat with that Collection and related
      calls; cannot create, delete, or reach other Collections or Chats.
  docs: https://docs.h2o.ai/enterprise-h2ogpte/guide/apis
  artifact: authentication/h2o-ai-authentication.yml
idempotency:
  supported: false
  evidence: >-
    No Idempotency-Key header, parameter or extension appears anywhere in the 422-operation
    OpenAPI document, and the docs publish no idempotency contract. The only idempotency
    statement in the spec is a per-operation note that DELETE on an admin session returns 204
    whether or not the session existed. Retrying a POST — create_collection,
    create_chat_session, ingest_* — will create a duplicate.
  agent_impact: >-
    An agent driving this API must de-duplicate on its own side (check list_collections /
    list_chat_sessions before creating) because the server offers no replay key.
pagination:
  style: offset-limit
  params:
  - {name: offset, in: query, type: integer, operations: 41}
  - {name: limit, in: query, type: integer, operations: 45}
  response_shape: bare JSON array
  count_operations:
    pattern: separate *_count operations return the total
    examples: [get_collection_count, get_document_count, get_chat_session_count]
  cursors: false
  link_header: false
  note: >-
    Collections list endpoints return a plain array with no envelope, so total counts come
    from the sibling count operations rather than from a wrapper object.
sorting_and_filtering:
  sort_column_param: sort_column
  ascending_param: ascending
  filter_param: filter
  note: Present on the larger list operations; derived from the OpenAPI parameters.
