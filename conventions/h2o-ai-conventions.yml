rate_limiting:
  documented_headers: none
  evidence: >-
    No rate-limit header, parameter or response code is declared in the OpenAPI document.
    The h2oGPTe 1.7 changelog announces "per-user API rate limiting and automated key
    deactivation" as an enterprise governance feature, but H2O.ai publishes no numeric
    limits, no retry-after contract and no header names, so no rate-limits artifact is
    asserted here.
  source: https://docs.h2o.ai/enterprise-h2ogpte/changelog
async_model:
  pattern: job-polling
  description: >-
    Long-running work (document ingestion, collection deletion, topic modelling, summarization)
    is started by a create_*_job operation that returns a job handle; the client then polls the
    Jobs operations. There is no webhook or callback surface — see asyncapi/ absence in this repo.
  job_operations: 28
  example_flow: [create_ingest_upload_job, get_job, list_jobs]
content_types:
  request: [application/json, multipart/form-data]
  response: [application/json, text/event-stream]
  streaming: >-
    Chat completions stream over server-sent events; interrupted LLM communication surfaces
    as the ChatError {"error": "..."} envelope.
