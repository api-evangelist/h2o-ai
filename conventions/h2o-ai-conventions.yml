  supported: false
metadata:
  supported: true
  mechanism: >-
    Collections, Documents and Chat Sessions carry free-form user metadata via dedicated
    operations and properties rather than a universal `metadata` object on every resource.
request_tracing:
  request_id_header: null
  evidence: No X-Request-Id / X-Correlation-Id header appears in the specification.
