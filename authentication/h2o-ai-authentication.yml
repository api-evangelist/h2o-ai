schemes:
- name: bearerAuth
  type: http
  scheme: bearer
  description: Using an API key generated by H2OGPTe
  header: Authorization
  format: 'Authorization: Bearer sk-...'
  key_prefix: sk-
  applied: globally (top-level security on all 422 operations)
  sources:
  - openapi/h2o-ai-h2ogpte-openapi-original.yml
  key_types:
  - name: global
    created_when: no Collection is selected at key creation
    grants: >-
      Full user impersonation and system-wide access. Anyone holding the key can create,
      delete or interact with any of the user's past, current and future Collections,
      Documents, Chats and settings.
  - name: collection-specific
    created_when: a Collection is selected at key creation
    grants: >-
      Chat with the specified Collection and related API calls to it only. Cannot create or
      delete Collections, and cannot reach other Collections or Chats.
  creation_ui: Account Circle > Using the API > + New API Key
  revocation: >-
