gaps:
- api: H2O MLOps Scoring REST API
  spec: openapi/h2o-ai-mlops-scoring-openapi-original.yml
  issue: >-
    The published specification declares no components.securitySchemes and no security
    requirement, yet every one of its seven operations declares a 401 response. The
    authentication mechanism for a deployed scoring endpoint is therefore not described by
    the contract and must be taken from the MLOps deployment configuration.
- api: Enterprise h2oGPTe REST API
  issue: >-
    The two key types are a real authorization model but are expressed only in prose. The
    specification carries one flat bearerAuth scheme with no scopes and no per-operation
    security differentiation, so a machine reader cannot tell which of the 422 operations a
    Collection-specific key may call.
